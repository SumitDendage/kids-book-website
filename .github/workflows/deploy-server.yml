# Puts the "api" server program online in Supabase, from GitHub (no Command Prompt needed).
# Runs by itself when supabase/functions changes on main, or by hand:
# GitHub -> Actions -> "Upload the server to Supabase" -> Run workflow.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens).
name: Upload the server to Supabase

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Supabase project ref (leave as is for the live site)'
        default: wjqmrcglzqemrvafjeel
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.project || 'wjqmrcglzqemrvafjeel' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Supabase key is saved
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (GitHub -> Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show which projects this key can reach (names only)
        run: supabase projects list || true
      - name: Upload the api function
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Check it answers
        run: |
          sleep 10
          curl -sS --max-time 30 "https://$PROJECT_REF.supabase.co/functions/v1/api/health" | tee health.json
          grep -q '"ok":true' health.json
