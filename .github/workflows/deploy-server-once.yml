
name: Deploy server to Supabase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-server-once.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/login-email-otp-security-alerts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy api --project-ref liaqgyskuhnxmlvmrnrl --no-verify-jwt --use-api
