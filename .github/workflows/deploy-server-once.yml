
name: Deploy server to Supabase
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # deploys the branch picked in "Run workflow" (main by default), so the live server is
      # always code that is on GitHub
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy api --project-ref liaqgyskuhnxmlvmrnrl --no-verify-jwt --use-api
